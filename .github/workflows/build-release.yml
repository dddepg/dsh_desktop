name: build-release

# 个人单架构构建（只出 x64 Windows）：监听个人 ezio 系列 tag（如
# 0.4.1-ezio.3，不带 v 前缀，不会命中官方 release.yml 的 v* 触发器，
# 避免双重构建）。官方多架构全量发版走 release.yml（v* tag）。
on:
  push:
    tags:
      - '*-ezio.*'
  workflow_dispatch:
    inputs:
      version:
        description: '要构建的版本号（例如 0.4.1-ezio.4；留空则用 dsh-desktop/package.json 的当前版本）'
        required: false
        default: ''
      draft:
        description: '是否创建为草稿 Release'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      prerelease:
        description: '是否标记为预发布（prerelease）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build-windows
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dsh-desktop/package-lock.json

      - name: Resolve release version
        shell: pwsh
        run: |
          $raw = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $raw = "${{ github.event.inputs.version }}"
          }
          if ([string]::IsNullOrWhiteSpace($raw)) {
            $raw = (Get-Content 'dsh-desktop/package.json' -Raw | ConvertFrom-Json).version
          }
          $version = ($raw -replace '^v', '').Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+') {
            throw "Invalid release version: '$version'"
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "release version: $version"

      - name: Install dependencies
        working-directory: dsh-desktop
        shell: pwsh
        run: npm ci

      - name: Apply release version
        working-directory: dsh-desktop
        shell: pwsh
        run: npm version "$env:RELEASE_VERSION" --no-git-tag-version --allow-same-version

      - name: Fetch bundled runtime
        working-directory: dsh-desktop
        shell: pwsh
        run: npm run fetch-runtime

      - name: Build Windows app
        working-directory: dsh-desktop
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: List artifacts
        shell: pwsh
        run: Get-ChildItem 'dsh-desktop\dist' | Select-Object Name, Length

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # tag 推送：沿用推上来的 tag 原名（ezio 系列不带 v，不再强制补 v
          # 前缀——补了会另造一个 v* tag）；手动触发：用解析出的版本号。
          tag_name: ${{ github.event_name == 'push' && github.ref_name || env.RELEASE_VERSION }}
          name: DSH Desktop ${{ env.RELEASE_VERSION }} (ezio)
          draft: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.draft == 'true' || false }}
          # tag 推送构建一律标记预发布；手动触发遵循输入。
          prerelease: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dsh-desktop/dist/*.exe
